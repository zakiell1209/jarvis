name: Build APK
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [index.html, shell.html, package.json, capacitor.config.json, .github/workflows/build.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Собрать web-часть
        run: |
          mkdir -p www
          cp shell.html www/index.html
          cp index.html www/app.html
          git hash-object index.html > www/app.sha
      - run: npx cap add android
      - run: npx cap sync android
      - name: Версия и подпись
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          if [ -n "$KS" ]; then
            mkdir -p ~/.android && echo "$KS" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::DEBUG_KEYSTORE_B64 не задан - подпись APK будет случайной, обновление поверх не установится"
          fi
      - run: cd android && ./gradlew assembleDebug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Jarvis build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
