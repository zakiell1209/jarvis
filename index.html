<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Джарвис</title>
<style>
:root{--bg:#dcfce7;--cd:#f0fdf4;--tx:#14532d;--mu:#4ade80;--ac:#16a34a;--ok:#16a34a;--bad:#dc2626;--bd:#bbf7d0;color-scheme:light}
body{background-size:cover;background-position:center;background-repeat:no-repeat;background-attachment:fixed}
@media(prefers-color-scheme:dark){:root{--bg:#052e16;--cd:#064e3b;--tx:#dcfce7;--mu:#34d399;--ac:#22c55e;--bd:#065f46;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 90px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:14px 2px;border:0;background:none;color:var(--mu);font-size:12.5px}nav button.on{color:var(--ac);font-weight:700}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
textarea,input,select{width:100%;box-sizing:border-box;border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit;background:var(--bg);color:var(--tx);margin:4px 0}
textarea{min-height:96px}input[type=checkbox]{width:auto;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.b{border:0;border-radius:10px;padding:11px 14px;font:inherit;background:var(--ac);color:#fff}.g{background:var(--bd);color:var(--tx)}.ok{background:var(--ok)}.rd{background:var(--bad)}.b:disabled{opacity:.5}
.mu{color:var(--mu);font-size:14px}.ans{white-space:pre-wrap}.er{color:var(--bad)}.mode{display:flex;gap:8px;align-items:center;margin-top:8px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bd);color:var(--mu)}
</style></head><body><main id="v"></main><nav id="tabs"></nav>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,10),clean=s=>s.replace(/```json|```/g,'').trim();
const DEF=`async function handle(task, api){
  if(task==='__ping__') return 'ok';
  return await api.agent(task);
}`;
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
let S=ld('jv_s',{log:[],tasks:[],rules:[]}),C=ld('jv_c',{provider:'gemini',model:'gemini-3.6-flash',key:'',selfReview:true,ghToken:'',ghRepo:'',pin:''});
const save=()=>{localStorage.setItem('jv_s',JSON.stringify(S));localStorage.setItem('jv_c',JSON.stringify(C))};
const h=async p=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('jv|'+p)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const curCode=()=>{const c=S.log.filter(e=>e.kind==='code'&&e.status==='active');return c.length?c[c.length-1].body:DEF};
const stopHit=t=>{const r=S.rules.find(r=>r.k==='stop'&&t.toLowerCase().includes(r.t.toLowerCase()));if(r)throw new Error('Заблокировано стоп-словом: '+r.t)};

const ft=(u,o)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),60000);return fetch(u,{...o,signal:c.signal}).catch(e=>{throw new Error(e.name==='AbortError'?'Нет ответа от сервера ИИ за 60 секунд (проверьте интернет, ключ и название модели)':'Сеть: '+e.message)}).finally(()=>clearTimeout(t))};
async function llm(prompt,raw){
  if(!C.key)throw new Error('Не указан ключ API (вкладка «Настройки»)');
  const rules=S.rules.filter(r=>r.k!=='stop').map(r=>(r.k==='deny'?'ЗАПРЕЩЕНО: ':'РАЗРЕШЕНО: ')+r.t).join('\n');
  const full=raw?prompt:'ПРАВИЛА ВЛАДЕЛЬЦА (нарушать нельзя ни при каких условиях):\n'+(rules||'(нет)')+'\n\n'+prompt;
  let t;
  if(C.provider==='gemini'){
    const r=await ft('https://generativelanguage.googleapis.com/v1beta/models/'+C.model+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':C.key},body:JSON.stringify({contents:[{parts:[{text:full}]}]})});
    const j=await r.json();if(!r.ok)throw new Error(j.error&&j.error.message||'Ошибка '+r.status);
    t=j.candidates[0].content.parts.map(p=>p.text||'').join('');
  }else{
    const r=await ft('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':C.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:C.model,max_tokens:8000,messages:[{role:'user',content:full}]})});
    const j=await r.json();if(!r.ok)throw new Error(j.error&&j.error.message||'Ошибка '+r.status);
    t=j.content.map(p=>p.text||'').join('');
  }
  if(!raw)stopHit(t);
  return t;
}

// Песочницы нет: код ИИ выполняется прямо в приложении, со всеми возможностями (сеть, файлы, DOM)
const AF=Object.getPrototypeOf(async function(){}).constructor;
async function runAgent(code,task,api){
  const fn=new AF('task','api',code+'\n;return await handle(task,api);');
  let to;
  try{return String(await Promise.race([fn(task,api),new Promise((_,no)=>{to=setTimeout(()=>no(new Error('Общий таймаут 15 минут')),900000)})]))}
  finally{clearTimeout(to)}
}

const mkApi=(id,auto)=>({
  llm:p=>llm(String(p)),
  memory:async()=>S.log.filter(e=>e.kind==='mem'&&e.status==='active').map(e=>({title:e.title,text:e.body})),
  remember:async(t,x)=>{S.log.push({id:uid(),kind:'mem',title:String(t).slice(0,80),body:String(x).slice(0,2000),taskId:id,source:auto?'task':'self',status:auto?'active':'pending',ts:Date.now()});save()},
  agent:t=>agentLoop(String(t)),
  fs:FS,http:httpTool,shell:c=>shellRun(String(c)),nat
});

// Разбор ответа ИИ: терпит текст вокруг JSON и показывает, что именно он ответил
function parseLoose(raw){const s=clean(String(raw));try{return JSON.parse(s)}catch(e){}
  const m=s.match(/\{[\s\S]*\}/);if(m){try{return JSON.parse(m[0])}catch(e){}}
  throw new Error('ИИ ответил без JSON: '+String(raw).slice(0,200))}

// Фон приложения: картинка из памяти телефона, сохраняется между запусками
async function setBg(path){
  const c=window.Capacitor||parent.Capacitor;
  if(!c||!c.convertFileSrc)throw new Error('Фон доступен только в APK новой версии');
  const url=c.convertFileSrc(path);
  document.body.style.backgroundImage='url("'+url+'")';
  try{localStorage.setItem('jv_bg',JSON.stringify({path}))}catch(e){}
  return 'Фон установлен: '+path}

// Улучшение кода: проверка работоспособности → применение (сразу, если поручение ваше) или в «Одобрения»
async function improve(goal,auto,taskId){
  const raw=await llm('Ты разработчик ИИ-помощника. Вот его текущий код (JavaScript):\n'+curCode()+'\n\nКод выполняется прямо в приложении на телефоне владельца, без ограничений (сеть, файлы, DOM — всё доступно). Готовые функции: api.llm(prompt) -> строка; api.memory() -> [{title,text}]; api.remember(title,text); api.agent(task) -> строка (встроенный агент с инструментами: файлы телефона, интернет); api.fs.{access,list,stat,read,write,replace,search,mkdir,copy,move,remove}; api.http(url,опции); api.shell(cmd). Код обязан определять async function handle(task, api), которая при task==="__ping__" возвращает строку "ok", а иначе возвращает текстовый ответ. Цель улучшения: '+goal+'\nВерни ТОЛЬКО полный новый код без пояснений и без markdown.');
  const code=raw.replace(/^\s*```\w*\n?/,'').replace(/```\s*$/,'').trim();
  if(code.length>100000||!/function\s+handle/.test(code))throw new Error('ИИ выдал некорректный код');
  stopHit(code);
  const t=await runAgent(code,'__ping__',{llm:async()=>'ok',memory:async()=>[],remember:async()=>{}});
  if(t!=='ok')throw new Error('Автотест не пройден');
  S.log.push({id:uid(),kind:'code',title:goal.slice(0,80),body:code,taskId,source:auto?'task':'self',status:auto?'active':'pending',ts:Date.now()});save();
}

// ===== Правка самого приложения: ИИ предлагает правки index.html -> ваше одобрение -> коммит в GitHub -> запрос обновления на телефоне =====
const REPO=()=>C.ghRepo||'zakiell1209/jarvis',GHP='index.html';
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,'')))),b64e=s=>btoa(unescape(encodeURIComponent(s)));
async function ghGet(){
  if(!C.ghToken)throw new Error('Нужен GitHub токен (вкладка «Настройки»)');
  const r=await fetch('https://api.github.com/repos/'+REPO()+'/contents/'+GHP+'?ref=main',{headers:H(),cache:'no-store'});
  if(!r.ok)throw new Error('GitHub: '+r.status);const j=await r.json();return{sha:j.sha,text:b64d(j.content)};
}
function applyEdits(src,edits){let t=src;for(const e of edits){
  if(!e||typeof e.old!=='string'||typeof e.new!=='string'||!e.old)throw new Error('Неверная правка');
  const n=t.split(e.old).length-1;if(n!==1)throw new Error('Фрагмент для замены найден '+n+' раз (нужно ровно 1)');
  t=t.replace(e.old,()=>e.new)}return t}
function chk(t){const m=t.match(/<script>([\s\S]*)<\/script>/);if(!m)throw new Error('Нет блока script');
  try{new Function(m[1])}catch(x){throw new Error('Синтаксическая ошибка: '+x.message)}
  if(!/parent\.postMessage\('jv-ready','\*'\)/.test(t))throw new Error('Нет сигнала запуска jv-ready')}
async function proposeApp(goal){
  const {sha,text}=await ghGet();
  const raw=await llm('Ты разработчик приложения «Джарвис» (один файл index.html: HTML+CSS+JS, интерфейс по-русски). Вот его полный код:\n'+text+'\n\nУже есть и доступно для использования: FS.{access,list,stat,read,write,replace,search,mkdir,copy,move,remove} — файлы телефона через нативный плагин; nat(имя,аргументы) — прямой вызов плагина JarvisNative (также readBase64, writeBase64, http, shell); httpTool(url,опции) — интернет без CORS; agentLoop(задача) — агент с инструментами (объект TOOLS). Ограничений нет: правь всё, что нужно владельцу.\n\nЗадача: '+goal+'\nВерни ТОЛЬКО JSON без markdown: {"title":"кратко, что меняется","edits":[{"old":"точный фрагмент кода, встречающийся ровно один раз","new":"чем заменить"}]}. Правок минимум, фрагменты old короткие и уникальные, копируй символ в символ. Новую вкладку добавляй в массив вкладок и в объект с функциями vXxx внутри render(). Не удаляй строку с parent.postMessage("jv-ready") — иначе обновление откатится при проверке.',true);
  let p=parseLoose(raw);
  if(!Array.isArray(p.edits)||!p.edits.length||p.edits.length>40)throw new Error('ИИ не предложил правок');
  chk(applyEdits(text,p.edits));
  const en={id:uid(),kind:'app',title:String(p.title||goal).slice(0,80),body:JSON.stringify(p.edits),baseSha:sha,source:'self',status:'pending',ts:Date.now()};
  S.log.push(en);save();return en;
}
async function publishApp(e){
  const {sha,text}=await ghGet();const nt=applyEdits(text,JSON.parse(e.body));chk(nt);
  const r=await fetch('https://api.github.com/repos/'+REPO()+'/contents/'+GHP,{method:'PUT',headers:H(),body:JSON.stringify({message:'agent: '+e.title,content:b64e(nt),sha,branch:'main'})});
  if(!r.ok)throw new Error('GitHub: '+r.status+' (токену нужно право Contents: Read and write)');
}
async function goApp(){if(!txt.trim()||busy)return;const t=txt;busy='Придумываю правки…';err='';ans='';render();
  try{const en=await proposeApp(t);txt='';if(C.autoApply){busy='Публикую…';render();await publishApp(en);en.status='published';ans='Правки опубликованы. Сейчас появится запрос на обновление.';parent.postMessage('jv-check','*')}else ans='Правки приложения ждут вашего решения во вкладке «Одобр.»'}catch(e){err=String(e.message||e)}busy='';save();render()}

let tab='task',busy='',err='',ans='',txt='',learn=false,ask=null,unlocked=false,msg='',rk='deny',rt='';
const status=s=>{busy=s;render()};
async function runTask(text,auto){
  const id='t'+Date.now();S.tasks.push({id,title:text.slice(0,80),ts:Date.now()});save();
  if(auto){status('Улучшаю себя под задачу…');try{await improve(text,true,id)}catch(e){err='Самоулучшение не удалось: '+e.message}}
  status('Выполняю…');
  ans=await runAgent(curCode(),text,mkApi(id,auto));stopHit(ans);
  if(C.selfReview&&!auto){status('Самоанализ…');try{const r=JSON.parse(clean(await llm('Задание: '+text+'\nТвой ответ: '+ans+'\nСтоит ли предложить владельцу улучшение твоего кода? Ответь JSON: {"suggest":true/false,"goal":"что улучшить"}')));if(r.suggest&&r.goal)await improve(String(r.goal),false,id)}catch(e){}}
}
async function go(){if(!txt.trim()||busy)return;const t=txt;busy='Работаю…';err='';ans='';render();try{await runTask(t,learn);txt=''}catch(e){err=String(e.message||e)}busy='';save();render()}
async function approve(e){
  if(e.kind==='app'){busy='Публикую…';render();try{await publishApp(e);e.status='published';save();parent.postMessage('jv-check','*')}catch(x){err=String(x.message||x)}busy='';save();render();return}
  if(e.kind==='mem'){e.status='active';save();render();return}
  S.log=S.log.filter(x=>x.id!==e.id);busy='Применяю…';render();
  try{await improve(e.title,true,e.taskId)}catch(x){err=String(x.message||x)}busy='';save();render();
}
function rollbackTask(id){
  const i=S.log.findIndex(e=>e.taskId===id);
  const ids=new Set([id]);if(i>=0)S.log.slice(i).forEach(e=>ids.add(e.taskId));
  S.log=S.log.filter(e=>!ids.has(e.taskId));S.tasks=S.tasks.filter(t=>!ids.has(t.id));save();
}
const conf=(k,fn)=>()=>{if(ask===k){ask=null;fn();render()}else{ask=k;render();setTimeout(()=>{if(ask===k){ask=null;render()}},4000)}};

function el(t,p,...c){const e=document.createElement(t);for(const k in p||{}){if(k==='class')e.className=p[k];else if(k.slice(0,2)==='on')e[k]=p[k];else if(p[k]===false)continue;else e.setAttribute(k,p[k]===true?'':p[k])}c.flat().forEach(x=>{if(x!=null&&x!==false)e.append(x)});return e}
function vTask(){
  const ta=el('textarea',{placeholder:'Что сделать? Например: научись составлять планы тренировок'});ta.value=txt;ta.oninput=()=>{txt=ta.value};
  const cb=el('input',{type:'checkbox'});cb.checked=learn;cb.onchange=()=>{learn=cb.checked;render()};
  return [el('div',{class:'card'},ta,el('label',{class:'mode'},cb,'Режим обучения: это моё поручение изменить тебя'),
    el('div',{class:'mu'},learn?'Улучшения применятся сразу — вы сами дали поручение.':'Обычный режим: любые изменения ждут вашего одобрения.'),
    el('div',{class:'row'},el('button',{class:'b',disabled:!!busy,onclick:go},busy||'Выполнить'),el('button',{class:'b g',disabled:!!busy,onclick:goApp},'Изменить приложение'))),
    err&&el('div',{class:'card er'},err),ans&&el('div',{class:'card ans'},ans),lastTrace&&el('details',{class:'card'},el('summary',null,'Что я делал'),el('div',{class:'mu ans'},lastTrace))];
}
function vOk(){
  const p=S.log.filter(e=>e.status==='pending');
  if(!p.length)return el('div',{class:'card mu'},'Предложений нет. Всё, что я захочу изменить сам, появится здесь и не сработает без вашего «Одобрить».');
  return [err&&el('div',{class:'card er'},err),...p.map(e=>el('div',{class:'card'},el('span',{class:'tag'},e.kind==='code'?'Изменение кода':e.kind==='app'?'Правка приложения':'Запись в память'),el('h3',null,e.title),el('div',{class:'ans mu'},e.kind==='mem'?e.body:e.kind==='app'?(e.risk?'⚠ Затрагивает защитные функции!\n\n':'')+JSON.parse(e.body).map(x=>'− '+x.old.slice(0,200)+'\n+ '+x.new.slice(0,400)).join('\n\n'):'ИИ хочет обновить свой код. Код проверен автотестом и проверяющим.'),
    el('div',{class:'row'},el('button',{class:'b ok',disabled:!!busy,onclick:()=>approve(e)},busy||'Одобрить'),el('button',{class:'b rd',onclick:()=>{S.log=S.log.filter(x=>x.id!==e.id);save();render()}},'Отклонить'))))];
}
let modApp=''; let modGoal=''; let modBusy=''; let modProgress=0; let modPkg='';
let allPhoneApps = [{name: 'Хорикрафт', packageName: 'com.hornicraft.app'}];
async function loadPhoneApps(){
  allPhoneApps = [{name: 'Хорикрафт', packageName: 'com.hornicraft.app'}];
  modPkg = 'com.hornicraft.app';
  render();
}
async function runModTask(){
  if(!modGoal.trim()||!modPkg)return;
  modBusy='Сканирование и распаковка…'; modProgress=10;
  render();
  try{
    modProgress=35; modBusy='Анализ файлов приложения '+modPkg+'…'; render();
    await nat('appInspect',{packageName: modPkg});
    modProgress=60; modBusy='Применение изменений…'; render();
    await agentLoop('Получи полный доступ ко всем файлам телефона через FS и модифицируй приложение ' + modPkg + ' по заданию: ' + modGoal + '. Используй app_modify, app_inspect и инструменты файловой системы.');
    modProgress=100; modBusy='';
    alert('Успешно! Изменения внесены и сохранены в приложении ' + modPkg);
  }catch(e){
    alert('Ошибка моддинга: ' + e.message);
  }
  modBusy=''; modProgress=0; render();
}
function vMod(){
  if(!allPhoneApps.length) loadPhoneApps();
  const ta = el('input',{placeholder:'Что изменить в выбранном приложении'}); ta.value=modGoal; ta.oninput=()=>modGoal=ta.value;
  return [
    el('div',{class:'card'},
      el('b',null,'Моддинг приложений телефона'),
      el('div',{class:'mu'},'Выберите приложение, опишите желаемые изменения и запустите процесс. Джарвис получит доступ ко всем файлам и изменит приложение.'),
      ta,
      el('div',{class:'card',style:'border-color:var(--ac);background:var(--bd);margin:8px 0'}, 
        el('b',null,'Целевое приложение: Хорикрафт'),
        el('div',{class:'mu',style:'font-size:11px'},'com.hornicraft.app')
      ),
      modProgress>0?el('div',{class:'card'},el('div',{class:'mu'},modBusy),el('div',{style:'background:var(--bd);border-radius:6px;height:12px;margin-top:6px;overflow:hidden'},el('div',{style:'background:var(--ac);width:'+modProgress+'%;height:100%;transition:width 0.3s'}))):null,
      el('div',{class:'row',style:'margin-top:10px'},el('button',{class:'b',disabled:!!modBusy||!modPkg,onclick:runModTask},modBusy||'Выполнить моддинг'))
    )
  ];
}
function vHist(){
  const out=[el('div',{class:'mu'},'Откат задачи удаляет её изменения и все более поздние (они могли на них опираться).')];
  [...S.tasks].reverse().forEach(t=>{
    const es=S.log.filter(e=>e.taskId===t.id);
    out.push(el('div',{class:'card'},el('b',null,t.title),...es.map(e=>el('div',{class:'mu'},(e.status==='active'?'✅ ':'⏳ ')+(e.kind==='code'?'код: ':'память: ')+e.title)),
      el('div',{class:'row'},el('button',{class:'b rd',onclick:conf('r'+t.id,()=>rollbackTask(t.id))},ask==='r'+t.id?'Точно откатить?':'Откатить задачу'))));
  });
  if(!S.tasks.length)out.push(el('div',{class:'card mu'},'История пуста.'));
  out.push(el('div',{class:'row'},el('button',{class:'b rd',onclick:conf('all',()=>{S.log=[];S.tasks=[];save()})},ask==='all'?'Точно стереть всё?':'Сбросить ИИ к заводскому')));
  return out;
}
function vRules(){

    if(hist.length>40000)hist='\n…(начало опущено)…\n'+hist.slice(-30000);
  }
  lastTrace=trace.join('\n');return 'Остановился после 30 шагов, не закончив. Что уже сделано — в разделе «Что я делал»; напишите «продолжай».';
}

// ===== Вкладка «Файлы»: проводник по памяти телефона =====
let pfp='',pfe=[],pff=null,pfq='',pfr=null,pfer='',pfload=false,pfacc=null,pfmode='phone',pfbusy='';
async function pfInit(){pfer='';try{pfacc=await FS.access();if(!pfacc.granted){try{await FS.requestAccess()}catch(ex){}}pfacc=await FS.access();if(pfacc.granted){await pfLs(pfp||pfacc.root);return}}catch(e){pfer=String(e.message||e)}render()}
async function pfLs(p){pfer='';pff=null;pfr=null;try{const r=await FS.list(p);pfp=r.path;pfe=r.entries;if(r.total>r.entries.length)pfer='Показано '+r.entries.length+' из '+r.total}catch(e){pfer=String(e.message||e)}render()}
const pfUp=()=>{const i=pfp.replace(/\/+$/,'').lastIndexOf('/');return i>0?pfp.slice(0,i):'/'};
const pfClose=()=>{if(pff&&pff.url)URL.revokeObjectURL(pff.url);pff=null;render()};
async function pfMedia(e){
  if(e.size>250e6)throw new Error('Файл больше 250 МБ — просмотр недоступен');
  const parts=[];let off=0;
  while(off<e.size){pfbusy='Читаю '+e.name+': '+Math.round(off/e.size*100)+'%';render();
    const r=await nat('readBase64',{path:e.path,offset:off,length:2000000});
    if(!r.read)break;parts.push(Uint8Array.from(atob(r.data),c=>c.charCodeAt(0)));off+=r.read}
  pfbusy='';
  const kind=/\.(glb|gltf)$/i.test(e.name)?'3d':'img';
  if(kind==='3d')await mvLoad();
  const mt=kind==='3d'?'model/gltf-binary':/\.png$/i.test(e.name)?'image/png':/\.gif$/i.test(e.name)?'image/gif':/\.webp$/i.test(e.name)?'image/webp':'image/jpeg';
  return{...e,kind,url:URL.createObjectURL(new Blob(parts,{type:mt}))};
}
async function pfOpen(e){
  if(e.dir)return pfLs(e.path);
  pfer='';
  try{
    if(/\.(glb|gltf|png|jpe?g|webp|gif)$/i.test(e.name))pff=await pfMedia(e);
    else{const r=await FS.read(e.path,0,1000000);pff={...e,kind:r.binary?'bin':'text',text:r.text,edit:r.text,truncated:r.truncated}}
  }catch(x){pfer=String(x.message||x);pfbusy=''}
  render();
}
async function pfSearch(kind){if(!pfq.trim())return;pfbusy='Ищу…';pfer='';render();
  try{pfr=await FS.search(kind==='name'?{root:pfp,name:pfq,maxResults:100}:{root:pfp,content:pfq,maxResults:100,timeoutMs:90000})}catch(e){pfer=String(e.message||e)}
  pfbusy='';render()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&pfacc&&!pfacc.granted)pfInit()});
function vFiles(){
  const sw=el('div',{class:'row'},el('button',{class:'b'+(pfmode==='phone'?'':' g'),onclick:()=>{pfmode='phone';render()}},'Телефон'),el('button',{class:'b'+(pfmode==='app'?'':' g'),onclick:()=>{pfmode='app';render()}},'В приложении'));
  if(pfmode==='app')return[sw,...vVault()];
  if(!pfload){pfload=true;pfInit()}
  const out=[sw];
  if(pfer)out.push(el('div',{class:'card er'},pfer));
  if(!pfacc||!pfacc.granted){
    out.push(el('div',{class:'card'},el('div',null,'Чтобы работать с файлами телефона, Android просит один раз включить «Доступ ко всем файлам». Нажмите кнопку, включите переключатель для «Джарвис» и вернитесь в приложение.'),
      el('div',{class:'row'},el('button',{class:'b',onclick:()=>FS.requestAccess().catch(e=>{pfer=String(e.message||e);render()})},'Разрешить доступ'),el('button',{class:'b g',onclick:pfInit},'Я разрешил — проверить'))));
    return out;
  }
  if(pff){
    const e=pff,body=[el('b',null,e.name),el('div',{class:'mu'},e.path+' · '+fs(e.size))],acts=[];
    if(e.kind==='3d')body.push(el('model-viewer',{src:e.url,'camera-controls':true,'auto-rotate':true,style:'width:100%;height:60vh;background:var(--bg);border-radius:10px'}));
    else if(e.kind==='img')body.push(el('img',{src:e.url,style:'max-width:100%;border-radius:10px'}));
    else if(e.kind==='text'){const ta=el('textarea',{style:'min-height:260px;font:13px/1.4 monospace'});ta.value=e.edit;ta.oninput=()=>{e.edit=ta.value};body.push(ta);
      if(e.truncated)body.push(el('div',{class:'mu er'},'Файл большой: показано только начало, сохранение отключено. Для правок попросите агента во вкладке «Задача».'));
      else acts.push(el('button',{class:'b ok',onclick:async()=>{try{const r=await FS.write(e.path,e.edit);pfer='Сохранено'+(r.backup?'. Прежняя версия: '+r.backup:'')}catch(x){pfer=String(x.message||x)}render()}},'Сохранить'))}
    else body.push(el('div',{class:'mu'},'Бинарный файл: просмотра нет, но агент может с ним работать — копировать, переносить, удалять.'));
    acts.push(el('button',{class:'b g',onclick:()=>{txt='Файл '+e.path+'\nЗадача: ';tab='task';pfClose()}},'В задачу'),
      el('button',{class:'b rd',onclick:conf('pd',()=>{FS.remove(e.path).then(()=>pfLs(pfp)).catch(x=>{pfer=String(x.message||x);render()})})},ask==='pd'?'Точно удалить?':'Удалить'),
      el('button',{class:'b g',onclick:pfClose},'Закрыть'));
    out.push(el('div',{class:'card'},...body,el('div',{class:'row'},...acts)));
    return out;
  }
  const q=el('input',{placeholder:'Найти в этой папке'});q.value=pfq;q.oninput=()=>{pfq=q.value};
  out.push(el('div',{class:'card'},el('div',{class:'mu'},pfp),
    el('div',{class:'row'},el('button',{class:'b g',onclick:()=>pfLs(pfUp())},'⬆ Вверх'),el('button',{class:'b g',onclick:()=>pfLs(pfp)},'Обновить'),el('button',{class:'b g',onclick:()=>pfLs(pfacc.trash)},'Корзина')),
    q,el('div',{class:'row'},el('button',{class:'b',disabled:!!pfbusy,onclick:()=>pfSearch('name')},pfbusy||'По имени'),el('button',{class:'b',disabled:!!pfbusy,onclick:()=>pfSearch('text')},'По тексту'))));
  const row=e=>el('div',{class:'card',style:'padding:9px 12px;margin:6px 0',onclick:()=>pfOpen(e)},el('b',null,(e.dir?'📁 ':'📄 ')+e.name),
    el('div',{class:'mu'},(e.dir?'папка':fs(e.size))+' · '+new Date(e.mtime).toLocaleDateString('ru')),
    ...(e.matches||[]).map(m=>el('div',{class:'mu'},'стр.'+m.line+': '+m.text)));
  if(pfr){out.push(el('div',{class:'mu'},'Найдено: '+pfr.results.length+(pfr.timedOut?' (поиск прерван по времени)':'')+'. Просмотрено '+pfr.scanned+' объектов.'),...pfr.results.map(row),el('div',{class:'row'},el('button',{class:'b g',onclick:()=>{pfr=null;render()}},'К списку папки')))}
  else out.push(...pfe.slice(0,300).map(row));
  return out;
}
function render(){
  const n=S.log.filter(e=>e.status==='pending').length;
  $('#tabs').replaceChildren(...[['task','Задача'],['mod','Моддинг'],['ok','Одобр.'+(n?' ('+n+')':'')],['hist','История'],['files','Файлы'],['rules','Правила'],['set','Настр.']].map(([k,l])=>el('button',{class:tab===k?'on':'',onclick:()=>{tab=k;msg='';render()}},l)));
  $('#v').replaceChildren(...[{task:vTask,mod:vMod,ok:vOk,hist:vHist,files:vFiles,rules:vRules,set:vSet}[tab]()].flat().filter(Boolean));
}
render();
try{document.body.style.backgroundImage='url("https://i.imgur.com/8Q9W46v.jpeg")';document.body.style.backgroundSize='cover';document.body.style.backgroundPosition='center';}catch(e){}try{parent.postMessage('jv-ready','*')}catch(e){}
</script></body></html>
